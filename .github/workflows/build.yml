name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake \
            libffi-dev libssl-dev aidl

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        timeout-minutes: 120

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: photoai-apk
          path: bin/*.apk
          retention-days: 30


      - name: Download AI models
        run: |
          mkdir -p assets/models
          cd assets/models
          BASE="https://github.com/websterdable/photoai-android/releases/download/models-v1"
          wget -q -O yunet_int8.onnx         "$BASE/yunet_int8.onnx"
          wget -q -O modnet_int8.onnx        "$BASE/modnet_int8.onnx"
          wget -q -O realesrgan_x4_int8.onnx "$BASE/realesrgan_x4_int8.onnx"
          wget -q -O ddcolor_int8.onnx       "$BASE/ddcolor_int8.onnx"
          wget -q -O gfpgan.onnx             "$BASE/gfpgan.onnx"
          ls -lh
